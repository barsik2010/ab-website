<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buchungssätze-Quiz · Aleks Holding</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{font-family:'Raleway',-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:24px 16px;background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);min-height:100vh;color:#1a1a1a}
  .wrap{max-width:860px;margin:0 auto}
  .header{background:linear-gradient(135deg,#023962 0%,#02477B 45%,#028BF2 100%);color:#fff;padding:28px 32px;border-radius:16px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 10px 30px -10px rgba(2,57,98,.4)}
  .header::before{content:'';position:absolute;top:-50%;right:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(255,255,255,.1) 0%,transparent 70%);pointer-events:none}
  .header h1{margin:0 0 6px;font-size:26px;font-weight:600;letter-spacing:-.5px}
  .header .sub{font-size:13px;opacity:.9;letter-spacing:.3px}
  .stats{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:1}
  .stat{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);padding:10px 16px;border-radius:10px;font-size:12px;min-width:90px;border:1px solid rgba(255,255,255,.1)}
  .stat strong{font-size:20px;display:block;font-family:'JetBrains Mono',monospace;font-weight:500}
  .stat.level-stat{background:rgba(255,255,255,.25);font-weight:700}
  .progress{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-bottom:20px}
  .progress-fill{height:100%;background:linear-gradient(90deg,#028BF2,#023962);transition:width .4s cubic-bezier(.4,0,.2,1);border-radius:3px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:28px;box-shadow:0 4px 12px -2px rgba(0,0,0,.04),0 2px 4px -1px rgba(0,0,0,.02)}
  .intro h2{color:#023962;margin:0 0 6px;font-size:22px;letter-spacing:-.3px}
  .intro p{color:#64748b;margin:0 0 18px;font-size:14px;line-height:1.6}
  .companies{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:20px}
  .company{padding:14px 16px;background:linear-gradient(135deg,#f8fafc,#f1f5f9);border:1px solid #e5e7eb;border-radius:10px;font-size:13px;line-height:1.5}
  .company .ico{font-size:22px;display:block;margin-bottom:4px}
  .company .name{font-weight:700;color:#023962;font-size:14px;margin-bottom:2px}
  .company .desc{color:#64748b;font-size:12px}
  .section-label{font-size:11px;color:#028BF2;letter-spacing:1.5px;text-transform:uppercase;font-family:'JetBrains Mono',monospace;margin:20px 0 10px;font-weight:700}
  .levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:20px}
  .level{padding:16px;background:#fff;border:2px solid #e5e7eb;border-radius:12px;cursor:pointer;transition:all .15s;text-align:center;font-family:inherit;position:relative}
  .level:hover{border-color:#028BF2;background:#f0f9ff;transform:translateY(-2px)}
  .level.selected{border-color:#028BF2;background:linear-gradient(135deg,#eff6ff,#dbeafe);box-shadow:0 4px 12px rgba(2,139,242,.2)}
  .level .lico{font-size:32px;display:block;margin-bottom:6px}
  .level .lname{font-weight:700;color:#023962;font-size:16px;margin-bottom:4px}
  .level .ldesc{color:#64748b;font-size:11.5px;line-height:1.4}
  .level .lcount{margin-top:8px;font-size:10px;font-family:'JetBrains Mono',monospace;color:#94a3b8;font-weight:700;letter-spacing:.5px}
  .level.selected .lcount{color:#028BF2}
  .topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:24px}
  .topic{padding:12px 14px;background:#fff;border:2px solid #e5e7eb;border-radius:10px;cursor:pointer;transition:all .15s;text-align:left;font-family:inherit}
  .topic:hover{border-color:#028BF2;background:#f0f9ff}
  .topic.selected{border-color:#028BF2;background:linear-gradient(135deg,#eff6ff,#dbeafe);box-shadow:0 2px 8px rgba(2,139,242,.15)}
  .topic .tname{font-weight:700;color:#023962;font-size:13px;margin-bottom:2px;display:block}
  .topic .tcnt{color:#94a3b8;font-size:11px;font-family:'JetBrains Mono',monospace}
  .topic.selected .tcnt{color:#028BF2}
  .start-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:8px}
  .selected-info{font-size:13px;color:#64748b}
  .selected-info b{color:#023962}
  .case-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .case-label{font-size:11px;color:#028BF2;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
  .case-badges{display:flex;gap:6px;flex-wrap:wrap}
  .case-topic{display:inline-block;background:#eff6ff;color:#02477B;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.3px}
  .case-level{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px}
  .case-level.nasenbohrer{background:#fef3c7;color:#854d0e}
  .case-level.checker{background:#dbeafe;color:#1e40af}
  .case-level.blitzkneisser{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff}
  .case-firma{background:linear-gradient(135deg,#023962,#02477B);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
  .case-text{font-size:15.5px;line-height:1.65;margin-bottom:10px;color:#1e293b}
  .case-text b{color:#023962}
  .case-text i{color:#64748b}
  .case-amount{font-size:18px;font-weight:700;color:#023962;margin-bottom:16px;font-family:'JetBrains Mono',monospace}
  .case-amount .lbl{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:1px;display:block;font-weight:600;margin-bottom:2px;font-family:'Raleway',sans-serif}
  .calc-hint{background:linear-gradient(135deg,#fefce8,#fef9c3);border-left:4px solid #eab308;border-radius:8px;padding:11px 14px;margin-bottom:18px;font-size:12.5px;line-height:1.6;color:#713f12}
  .calc-hint .h{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px;color:#854d0e;font-family:'JetBrains Mono',monospace;display:block}
  .calc-hint code{background:rgba(255,255,255,.7);padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11.5px}
  .tip-toggle{background:linear-gradient(135deg,#fefce8,#fef9c3);border:1px dashed #eab308;color:#854d0e;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:18px;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:all .15s}
  .tip-toggle:hover{background:#fef3c7;border-style:solid}
  .browser{background:linear-gradient(135deg,#f1f5f9,#e2e8f0);border-radius:12px;padding:14px;margin-bottom:20px}
  .browser-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap}
  .search-box{flex:1;min-width:200px;position:relative}
  .search-box input{width:100%;padding:9px 14px 9px 36px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff;transition:all .15s}
  .search-box input:focus{border-color:#028BF2;box-shadow:0 0 0 3px rgba(2,139,242,.12)}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:15px;font-weight:700;pointer-events:none}
  .clear-search{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:18px;padding:2px 6px;display:none}
  .clear-search.visible{display:block}
  .tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
  .tab{padding:6px 11px;background:#fff;border:1px solid #cbd5e1;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace;color:#64748b;user-select:none}
  .tab:hover{border-color:#028BF2;color:#028BF2}
  .tab.active{background:linear-gradient(135deg,#023962,#02477B);color:#fff;border-color:#023962;box-shadow:0 2px 6px rgba(2,57,98,.25)}
  .tab-label{font-size:10px;color:#64748b;margin-bottom:6px;font-family:'JetBrains Mono',monospace;letter-spacing:1.5px;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;max-height:200px;overflow-y:auto;padding:8px;background:#fff;border-radius:8px;border:1px solid #e5e7eb;align-content:flex-start}
  .chips::-webkit-scrollbar{width:8px}
  .chips::-webkit-scrollbar-track{background:#f1f5f9;border-radius:4px}
  .chips::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .chip{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:6px 10px;font-size:12px;cursor:grab;user-select:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);max-width:100%}
  .chip:hover{border-color:#028BF2;transform:translateY(-1px);box-shadow:0 3px 6px rgba(2,139,242,.15)}
  .chip:active{cursor:grabbing}
  .chip.dragging{opacity:.35}
  .chip.placed{opacity:.3;cursor:not-allowed;pointer-events:none;background:#f1f5f9}
  .chip .nr{font-family:'JetBrains Mono',monospace;font-weight:600;opacity:.65;font-size:10px}
  .chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
  .chips-empty{padding:30px 14px;text-align:center;color:#94a3b8;font-size:12px;width:100%}
  .chips-count{font-size:10px;color:#94a3b8;font-family:'JetBrains Mono',monospace;padding:0 4px 6px;font-weight:600;letter-spacing:.5px}
  .booking{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;margin-bottom:20px;align-items:stretch}
  .zone{min-height:120px;border:2px dashed #cbd5e1;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fafbfc;transition:all .15s}
  .zone.over{border-color:#028BF2;background:#eff6ff;border-style:solid}
  .zone-label{font-size:11px;font-weight:700;letter-spacing:1.5px;font-family:'JetBrains Mono',monospace}
  .zone.soll .zone-label{color:#02477B}
  .zone.haben .zone-label{color:#028BF2}
  .zone-content{display:flex;flex-direction:column;gap:6px}
  .placed-row{display:flex;gap:6px;align-items:center;background:linear-gradient(135deg,#023962,#02477B);color:#fff;border-radius:8px;padding:6px 8px 6px 10px;box-shadow:0 2px 8px rgba(2,57,98,.25);cursor:grab;user-select:none;transition:transform .1s}
  .placed-row:hover{transform:translateY(-1px)}
  .placed-row:active{cursor:grabbing}
  .placed-row.dragging{opacity:.35}
  .placed-row .label{flex:1;font-size:12px;line-height:1.3;min-width:0}
  .placed-row .label .nr{font-family:'JetBrains Mono',monospace;font-weight:600;opacity:.85;font-size:10px;display:block}
  .placed-row .label .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .placed-row input{width:90px;padding:5px 8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.95);color:#023962;border-radius:6px;font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:600;outline:none;text-align:right}
  .placed-row input:focus{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
  .placed-row .remove{background:rgba(255,255,255,.15);border:none;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
  .placed-row .remove:hover{background:rgba(255,255,255,.3)}
  .zone-sum{margin-top:auto;padding-top:8px;border-top:1px solid #e5e7eb;font-size:11px;color:#64748b;font-family:'JetBrains Mono',monospace;display:flex;justify-content:space-between;font-weight:600}
  .zone-sum .v{color:#023962;font-size:13px}
  .an{display:flex;align-items:center;justify-content:center;font-weight:700;color:#94a3b8;font-size:15px;padding:0 6px;font-style:italic}
  .btn-row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px;align-items:center}
  .btn{padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;letter-spacing:.2px}
  .btn-primary{background:linear-gradient(135deg,#028BF2,#02477B);color:#fff;box-shadow:0 2px 8px rgba(2,139,242,.3)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(2,139,242,.4)}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-secondary{background:#fff;color:#64748b;border:1px solid #cbd5e1}
  .btn-secondary:hover{background:#f8fafc;border-color:#94a3b8}
  .btn-large{padding:14px 28px;font-size:15px}
  .feedback{margin-top:18px;padding:16px 18px;border-radius:12px;font-size:14px;line-height:1.55;display:none;animation:slideIn .25s ease-out}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .feedback.correct{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-left:4px solid #10b981;color:#064e3b;display:block}
  .feedback.wrong{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-left:4px solid #ef4444;color:#7f1d1d;display:block}
  .feedback .head{display:block;margin-bottom:6px;font-size:13px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
  .feedback .solution{margin-top:10px;padding:10px 12px;background:rgba(255,255,255,.6);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7}
  .feedback .explain{margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);font-size:13.5px;line-height:1.65}
  .feedback .explain b{color:#023962}
  .feedback .esels{background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:12.5px;line-height:1.55;color:#713f12;border-left:3px solid #d97706}
  .feedback .esels .h{font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:10px;color:#854d0e;display:block;margin-bottom:4px;font-family:'JetBrains Mono',monospace}
  .feedback .praxis{background:linear-gradient(135deg,#e0e7ff,#c7d2fe);border-radius:8px;padding:10px 14px;margin-top:8px;font-size:12.5px;line-height:1.55;color:#312e81;border-left:3px solid #4f46e5}
  .feedback .praxis .h{font-weight:700;text-transform:uppercase;letter-spacing:1px;font-size:10px;color:#3730a3;display:block;margin-bottom:4px;font-family:'JetBrains Mono',monospace}
  .errlist{margin:8px 0 0 0;padding-left:18px;font-size:12.5px}
  .errlist li{margin:3px 0}
  .complete{text-align:center;padding:40px 24px}
  .complete h2{color:#023962;margin:0 0 12px;font-size:28px;letter-spacing:-.5px}
  .complete .final{font-size:56px;font-weight:700;color:#028BF2;margin:20px 0;font-family:'JetBrains Mono',monospace;letter-spacing:-1px}
  .complete p{color:#64748b;margin-bottom:8px}
  .complete .level-badge{display:inline-block;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.5px;margin-bottom:12px;text-transform:uppercase}
  .footer{text-align:center;margin-top:20px;font-size:11px;color:#94a3b8;letter-spacing:.5px}

  /* Stats Dashboard */
  .stats-dashboard{margin-bottom:20px;background:linear-gradient(135deg,#f8fafc,#f1f5f9);border:1px solid #e5e7eb;border-radius:12px;padding:16px}
  .stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
  .stat-box{padding:10px;background:#fff;border:2px solid #e5e7eb;border-radius:8px;text-align:center;cursor:pointer;transition:all .15s;font-family:inherit}
  .stat-box:hover{border-color:#028BF2;transform:translateY(-1px)}
  .stat-box.active{border-color:#028BF2;background:linear-gradient(135deg,#eff6ff,#dbeafe);box-shadow:0 2px 8px rgba(2,139,242,.15)}
  .stat-box .ico{font-size:18px;display:block;margin-bottom:2px}
  .stat-box .val{font-size:18px;font-weight:700;color:#023962;font-family:'JetBrains Mono',monospace;display:block;line-height:1.2}
  .stat-box .lbl{font-size:9px;color:#64748b;font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:block;margin-top:2px}
  .stat-box.active .val{color:#028BF2}
  .filter-info{font-size:12px;color:#64748b;text-align:center;padding:6px;border-radius:6px;background:rgba(2,139,242,.08);margin-top:6px}
  .filter-info b{color:#023962}
  .reset-btn{background:none;border:1px solid #e5e7eb;color:#94a3b8;font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit;margin-left:8px}
  .reset-btn:hover{border-color:#ef4444;color:#ef4444}

  /* Result Status Badges (Pro completion) */
  .status-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0;text-align:left}
  .status-card{padding:10px;background:#fff;border-radius:8px;border-left:3px solid #ccc;text-align:center}
  .status-card .ic{font-size:20px;display:block;margin-bottom:2px}
  .status-card .nm{font-size:11px;color:#64748b;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .status-card .vl{font-size:22px;font-weight:700;color:#023962;font-family:'JetBrains Mono',monospace;display:block;margin-top:2px}

  @media (max-width:540px){
    .booking{grid-template-columns:1fr;gap:8px}
    .an{padding:4px 0;font-size:13px}
    .header{padding:22px}.card{padding:20px}
    .placed-row input{width:78px}
    .tab{font-size:11px;padding:5px 9px}
    .stats-grid{grid-template-columns:repeat(3,1fr)}
    .status-summary{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>
<div class="wrap">

</div>

const STORAGE_KEY = 'aleks_quiz_progress_v1';

// History per case:
// { caseId: { correctStreak: int, totalAttempts: int, correctAttempts: int, lastSeen: timestamp } }
function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveHistory(h) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); } catch(e) {}
}
function getCaseStatus(caseId) {
  const h = loadHistory();
  const entry = h[caseId];
  if (!entry || entry.totalAttempts === 0) return 'neu';
  if (entry.correctStreak >= 3) return 'mastered';
  if (entry.correctStreak >= 2) return 'gekonnt';
  // Check last result
  const lastWasCorrect = entry.correctStreak > 0;
  if (!lastWasCorrect) return 'nichtgekonnt';
  return 'wackelig'; // mix of correct and incorrect
}
function recordResult(caseId, correct) {
  const h = loadHistory();
  if (!h[caseId]) h[caseId] = { correctStreak: 0, totalAttempts: 0, correctAttempts: 0, lastSeen: 0 };
  h[caseId].totalAttempts += 1;
  h[caseId].lastSeen = Date.now();
  if (correct) {
    h[caseId].correctAttempts += 1;
    h[caseId].correctStreak += 1;
  } else {
    h[caseId].correctStreak = 0;
  }
  saveHistory(h);
}
function getStatusCounts(pool) {
  const counts = { neu:0, nichtgekonnt:0, wackelig:0, gekonnt:0, mastered:0 };
  pool.forEach(c => { counts[getCaseStatus(c.id)] += 1; });
  return counts;
}

// Smart selection: prioritize weak cases
function selectCasesForRun(pool, targetCount) {
  if (pool.length === 0) return [];
  
  // Group by status
  const byStatus = { neu:[], nichtgekonnt:[], wackelig:[], gekonnt:[], mastered:[] };
  pool.forEach(c => byStatus[getCaseStatus(c.id)].push(c));
  
  // Shuffle each group
  Object.keys(byStatus).forEach(k => byStatus[k].sort(() => Math.random() - 0.5));
  
  // Target distribution: 35% nichtgekonnt+wackelig, 30% neu, 25% gekonnt, 10% mastered
  // Prefer in this order, fall back if not enough available
  const targets = [
    { groups: ['nichtgekonnt','wackelig'], share: 0.50 },
    { groups: ['neu'], share: 0.30 },
    { groups: ['gekonnt'], share: 0.15 },
    { groups: ['mastered'], share: 0.05 }
  ];
  
  const selected = [];
  const remaining = JSON.parse(JSON.stringify({
    neu: byStatus.neu.map(c => c.id),
    nichtgekonnt: byStatus.nichtgekonnt.map(c => c.id),
    wackelig: byStatus.wackelig.map(c => c.id),
    gekonnt: byStatus.gekonnt.map(c => c.id),
    mastered: byStatus.mastered.map(c => c.id)
  }));
  const idMap = {};
  pool.forEach(c => idMap[c.id] = c);
  
  for (const t of targets) {
    const want = Math.ceil(targetCount * t.share);
    let taken = 0;
    for (const g of t.groups) {
      while (taken < want && remaining[g].length > 0 && selected.length < targetCount) {
        selected.push(idMap[remaining[g].shift()]);
        taken++;
      }
      if (selected.length >= targetCount) break;
    }
    if (selected.length >= targetCount) break;
  }
  
  // Fill remaining slots from any remaining cases (cycle through all)
  const leftover = Object.values(remaining).flat();
  while (selected.length < targetCount && leftover.length > 0) {
    selected.push(idMap[leftover.shift()]);
  }
  
  // If still not enough (pool smaller than target), repeat
  while (selected.length < targetCount && pool.length > 0) {
    const extra = [...pool].sort(() => Math.random() - 0.5);
    for (const c of extra) {
      if (selected.length >= targetCount) break;
      selected.push(c);
    }
  }
  
  return selected.slice(0, targetCount);
}

function updatePoolCount() {
  const levelDiff = levels[selectedLevel].difficulty;
  let pool = allCases.filter(c => selectedTopics.has(c.topic) && c.difficulty === levelDiff);
  if (statusFilter) {
    pool = pool.filter(c => getCaseStatus(c.id) === statusFilter);
  }
  const target = levels[selectedLevel].count;
  const filterInfo = statusFilter ? ` · nur <b>${statusInfo[statusFilter].name}</b> ${statusInfo[statusFilter].icon}` : '';
  document.getElementById('poolInfo').innerHTML = 
    `<b>${pool.length}</b> Fälle im Pool · <b>${target}</b> ${levels[selectedLevel].icon} ${levels[selectedLevel].name}-Runde${filterInfo}`;
  document.getElementById('startBtn').disabled = pool.length < 1 || selectedTopics.size === 0;
}

function startQuiz() {
  const levelDiff = levels[selectedLevel].difficulty;
  let pool = allCases.filter(c => selectedTopics.has(c.topic) && c.difficulty === levelDiff);
  if (statusFilter) {
    pool = pool.filter(c => getCaseStatus(c.id) === statusFilter);
  }
  if (pool.length === 0) return;
  
  const targetCount = levels[selectedLevel].count;
  
  // Use smart selection (only if no explicit filter — if filter is set, use simple random)
  if (statusFilter) {
    let shuffled = [...pool].sort(() => Math.random() - 0.5);
    while (shuffled.length < targetCount && pool.length > 0) {
      shuffled = shuffled.concat([...pool].sort(() => Math.random() - 0.5));
    }
    activeCases = shuffled.slice(0, targetCount);
  } else {
    activeCases = selectCasesForRun(pool, targetCount);
  }
  
  cur = 0; geschafft = 0; strk = 0;
  caseResults = [];
  document.getElementById('topStats').style.display = 'flex';
  document.getElementById('topProgress').style.display = 'block';
  document.getElementById('sl').textContent = levels[selectedLevel].icon;
  render();
}

function getKontenForView() {
  if (searchTerm.length > 0) {
    const term = searchTerm.toLowerCase();
    return Object.keys(kontenrahmen).filter(k => 
      k.toLowerCase().includes(term) || kontenrahmen[k].toLowerCase().includes(term)
    ).slice(0, 60);
  }
  return Object.keys(kontenrahmen).filter(k => k.charAt(0) === activeTab);
}

function isPlaced(k) {
  return pS.some(x => x.k === k) || pH.some(x => x.k === k);
}

function setupBrowser() {
  const search = document.getElementById('search');
  const clearBtn = document.getElementById('clearSearch');
  search.addEventListener('input', e => {
    searchTerm = e.target.value.trim();
    clearBtn.classList.toggle('visible', searchTerm.length > 0);
    renderChips();
  });
  clearBtn.addEventListener('click', () => {
    searchTerm = '';
    search.value = '';
    clearBtn.classList.remove('visible');
    renderChips();
  });
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      activeTab = t.dataset.tab;
      searchTerm = '';
      search.value = '';
      clearBtn.classList.remove('visible');
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      renderChips();
    });
  });
}

function renderChips() {
  const chips = document.getElementById('chips');
  const countEl = document.getElementById('chipsCount');
  const list = getKontenForView();
  
  if (searchTerm.length > 0) {
    countEl.textContent = list.length === 0 ? 'Keine Treffer' : `${list.length} Treffer für "${searchTerm}"${list.length === 60 ? ' (gekürzt)' : ''}`;
  } else {
    countEl.textContent = `KLASSE ${activeTab} · ${list.length} Konten`;
  }
  
  chips.innerHTML = '';
  if (list.length === 0) {
    chips.innerHTML = '<div class="chips-empty">Keine passenden Konten gefunden.</div>';
    return;
  }
  list.forEach(k => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (isPlaced(k) ? ' placed' : '');
    chip.draggable = !isPlaced(k);
    chip.dataset.k = k;
    chip.innerHTML = `<span class="nr">${k}</span><span class="nm">${kontenrahmen[k]}</span>`;
    if (!isPlaced(k)) {
      chip.addEventListener('dragstart', e => {
        e.dataTransfer.setData('k', k);
        e.dataTransfer.setData('from', '');
        chip.classList.add('dragging');
      });
      chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
    }
    chips.appendChild(chip);
  });
}

function renderZones() {
  renderZone('soll', pS);
  renderZone('haben', pH);
  updateSums();
}

function renderZone(side, list) {
  const id = side === 'soll' ? 'zs-content' : 'zh-content';
  const el = document.getElementById(id);
  el.innerHTML = '';
  list.forEach((entry, idx) => {
    const row = document.createElement('div');
    row.className = 'placed-row';
    row.draggable = true;
    row.dataset.k = entry.k;
    row.dataset.side = side;
    row.dataset.idx = idx;
    row.innerHTML = `
      <div class="label">
        <span class="nr">${entry.k}</span>
        <span class="nm">${kontenrahmen[entry.k]}</span>
      </div>
      <input type="number" step="0.01" placeholder="0.00" value="${entry.amount || ''}" data-side="${side}" data-idx="${idx}">
      <button class="remove" data-side="${side}" data-idx="${idx}" title="Entfernen">×</button>
    `;
    // Drag handlers — only fire if user grabs the row (not input/button)
    row.addEventListener('dragstart', e => {
      // Don't start drag from the input field or remove button
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') {
        e.preventDefault();
        return;
      }
      e.dataTransfer.setData('k', entry.k);
      e.dataTransfer.setData('from', side);
      e.dataTransfer.setData('idx', String(idx));
      row.classList.add('dragging');
    });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    el.appendChild(row);
  });
  el.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', e => {
      const s = e.target.dataset.side;
      const i = parseInt(e.target.dataset.idx);
      const arr = s === 'soll' ? pS : pH;
      arr[i].amount = parseFloat(e.target.value) || 0;
      updateSums();
    });
    // Prevent drag from input
    inp.addEventListener('mousedown', e => e.stopPropagation());
  });
  el.querySelectorAll('.remove').forEach(btn => {
    btn.addEventListener('click', e => {
      const s = e.currentTarget.dataset.side;
      const i = parseInt(e.currentTarget.dataset.idx);
      const arr = s === 'soll' ? pS : pH;
      arr.splice(i, 1);
      renderZones();
      renderChips();
    });
  });
}

function updateSums() {
  const sSum = pS.reduce((a, b) => a + (b.amount || 0), 0);
  const hSum = pH.reduce((a, b) => a + (b.amount || 0), 0);
  document.getElementById('zs-sum').textContent = '€ ' + sSum.toLocaleString('de-AT', {minimumFractionDigits: 2});
  document.getElementById('zh-sum').textContent = '€ ' + hSum.toLocaleString('de-AT', {minimumFractionDigits: 2});
  const balanced = Math.abs(sSum - hSum) < 0.01 && sSum > 0;
  document.getElementById('zs-sum').style.color = balanced ? '#10b981' : '#023962';
  document.getElementById('zh-sum').style.color = balanced ? '#10b981' : '#023962';
}

function setupDropZones() {
  ['zs', 'zh'].forEach(id => {
    const z = document.getElementById(id);
    const targetSide = id === 'zs' ? 'soll' : 'haben';
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', e => {
      if (!z.contains(e.relatedTarget)) z.classList.remove('over');
    });
    z.addEventListener('drop', e => {
      e.preventDefault();
      z.classList.remove('over');
      const k = e.dataTransfer.getData('k');
      if (!k) return;
      const from = e.dataTransfer.getData('from'); // '', 'soll', or 'haben'
      if (from === 'soll' || from === 'haben') {
        // Move between zones — preserve amount
        if (from === targetSide) return; // dropped on same side, no-op
        const sourceArr = from === 'soll' ? pS : pH;
        const targetArr = targetSide === 'soll' ? pS : pH;
        const idx = parseInt(e.dataTransfer.getData('idx'));
        const entry = sourceArr[idx];
        if (!entry) return;
        sourceArr.splice(idx, 1);
        targetArr.push(entry);
        renderZones();
        renderChips();
      } else {
        // Drop from chips — only allow if not already placed
        if (isPlaced(k)) return;
        const target = targetSide === 'soll' ? pS : pH;
        target.push({ k: k, amount: 0 });
        renderZones();
        renderChips();
      }
    });
  });
}

function check() {
  const c = activeCases[cur];
  const sKonten = pS.map(x => x.k).sort();
  const hKonten = pH.map(x => x.k).sort();
  const sExp = [...c.s].sort();
  const hExp = [...c.h].sort();
  const sKontenOK = arraysEq(sKonten, sExp);
  const hKontenOK = arraysEq(hKonten, hExp);

  let amountErrors = [];
  if (sKontenOK) {
    pS.forEach(entry => {
      const expected = c.sa[entry.k];
      if (Math.abs((entry.amount || 0) - expected) >= 0.01) {
        amountErrors.push(`SOLL · ${entry.k} ${kontenrahmen[entry.k]}: € ${(entry.amount || 0).toFixed(2)} → richtig € ${expected.toFixed(2)}`);
      }
    });
  }
  if (hKontenOK) {
    pH.forEach(entry => {
      const expected = c.ha[entry.k];
      if (Math.abs((entry.amount || 0) - expected) >= 0.01) {
        amountErrors.push(`HABEN · ${entry.k} ${kontenrahmen[entry.k]}: € ${(entry.amount || 0).toFixed(2)} → richtig € ${expected.toFixed(2)}`);
      }
    });
  }

  const allCorrect = sKontenOK && hKontenOK && amountErrors.length === 0;
  const fb = document.getElementById('fb');
  
  if (allCorrect) {
    // Only count as "geschafft" if first attempt was correct AND not yet recorded
    if (firstAttemptCorrect && !caseResults.some(r => r.id === c.id)) {
      geschafft += 1;
      strk += 1;
      recordResult(c.id, true);
      caseResults.push({ id: c.id, correct: true });
    }
    // If already failed once, we already recorded it as incorrect — don't record again
    
    fb.className = 'feedback correct';
    let html = firstAttemptCorrect 
      ? `<span class="head">✓ Geschafft!</span>Konten und Beträge stimmen.`
      : `<span class="head">✓ Jetzt richtig!</span>Beim ersten Versuch noch nicht ganz — kommt nochmal in einer der nächsten Runden.`;
    html += `<div class="explain">${c.e}</div>`;
    if (c.es) html += `<div class="esels"><span class="h">🧠 Eselsbrücke</span>${c.es}</div>`;
    if (c.pr) html += `<div class="praxis"><span class="h">🌍 Praxis-Bezug</span>${c.pr}</div>`;
    fb.innerHTML = html;
    const btn = document.getElementById('bc');
    btn.textContent = cur === activeCases.length - 1 ? 'Auswertung →' : 'Nächster Geschäftsfall →';
    btn.onclick = () => { cur++; render(); };
  } else {
    firstAttemptCorrect = false;
    strk = 0;
    fb.className = 'feedback wrong';
    let html = '<span class="head">✗ Nicht ganz – schau dir die Lösung an</span>';
    if (!sKontenOK || !hKontenOK) {
      html += 'Die <b>Konten</b> stimmen noch nicht.';
    } else if (amountErrors.length > 0) {
      html += 'Konten passen ✓ – aber die <b>Beträge</b> stimmen nicht:';
      html += '<ul class="errlist">' + amountErrors.map(e => `<li>${e}</li>`).join('') + '</ul>';
    }
    const cs = c.s.map(k => `${k} ${kontenrahmen[k]} → € ${c.sa[k].toLocaleString('de-AT', {minimumFractionDigits: 2})}`).join('<br>');
    const ch = c.h.map(k => `${k} ${kontenrahmen[k]} → € ${c.ha[k].toLocaleString('de-AT', {minimumFractionDigits: 2})}`).join('<br>');
    html += `<div class="solution"><b>SOLL:</b><br>${cs}<br><br><b>an HABEN:</b><br>${ch}</div>`;
    html += `<div class="explain">${c.e}</div>`;
    if (c.es) html += `<div class="esels"><span class="h">🧠 Eselsbrücke</span>${c.es}</div>`;
    if (c.pr) html += `<div class="praxis"><span class="h">🌍 Praxis-Bezug</span>${c.pr}</div>`;
    fb.innerHTML = html;
    // Record as incorrect (only count the first time the case is shown)
    if (!caseResults.some(r => r.id === c.id)) {
      recordResult(c.id, false);
      caseResults.push({ id: c.id, correct: false });
    }
    // Change "Prüfen" button into "Nächster Fall" - so Aleks can move on
    const btn = document.getElementById('bc');
    btn.textContent = cur === activeCases.length - 1 ? 'Auswertung →' : 'Nächster Fall →';
    btn.onclick = () => { cur++; render(); };
    // Reset button becomes "Nochmal versuchen" — re-attempt this case
    const rbtn = document.getElementById('br');
    rbtn.textContent = 'Nochmal versuchen';
    rbtn.onclick = () => {
      // re-render same case but keep firstAttemptCorrect = false (already wrong)
      pS = []; pH = [];
      renderZones();
      renderChips();
      document.getElementById('fb').innerHTML = '';
      document.getElementById('fb').className = 'feedback';
      // Restore button states
      const checkBtn = document.getElementById('bc');
      checkBtn.textContent = 'Prüfen';
      checkBtn.onclick = check;
      const resetBtn = document.getElementById('br');
      resetBtn.textContent = 'Zurücksetzen';
      resetBtn.onclick = render;
    };
  }
  document.getElementById('sp').textContent = geschafft;
  document.getElementById('ss').textContent = strk;
}

function arraysEq(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

function done() {
  document.getElementById('pf').style.width = '100%';
  document.getElementById('sc').textContent = activeCases.length;
  const total = activeCases.length;
  const pct = total > 0 ? Math.round(geschafft / total * 100) : 0;
  const level = levels[selectedLevel];
  let msg = "Top Leistung! 🎯";
  if (pct < 50) msg = selectedLevel === 'blitzkneisser' ? "Brutal aber lehrreich. Nochmal!" : "Übung macht den Meister – nochmal!";
  else if (pct < 80) msg = "Schon richtig gut!";
  else if (pct >= 90 && selectedLevel === 'blitzkneisser') msg = "Du bist ein wahrer Bilanz-Boss! 👑";
  
  // Status summary across ALL cases (not just this run)
  const counts = getStatusCounts(allCases);
  const statusHtml = Object.entries(statusInfo).map(([k,s]) => `
    <div class="status-card" style="border-left-color:${s.color}">
      <span class="ic">${s.icon}</span>
      <span class="nm">${s.name}</span>
      <span class="vl">${counts[k]}</span>
    </div>
  `).join('');
  
  document.getElementById('qc').innerHTML = `
    <div class="card complete">
      <div class="level-badge" style="background:${level.color}20;color:${level.color}">${level.icon} ${level.name} abgeschlossen</div>
      <h2>Geschafft, Aleks!</h2>
      <div class="final">${geschafft} / ${total}</div>
      <p style="font-size:16px;color:#023962;font-weight:600">${msg} (${pct}%)</p>
      <p>Beste Streak in dieser Runde: <b>${strk} 🔥</b></p>
      
      <div style="margin-top:24px;text-align:left">
        <div style="font-size:11px;color:#028BF2;letter-spacing:1.5px;text-transform:uppercase;font-family:'JetBrains Mono',monospace;font-weight:700;text-align:center;margin-bottom:8px">Gesamtfortschritt</div>
        <div class="status-summary">${statusHtml}</div>
      </div>
      
      <div style="display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap">
        <button class="btn btn-secondary" onclick="renderIntro()">← Einstellungen ändern</button>
        <button class="btn btn-primary" onclick="startQuiz()">Nochmal mit gleichen Einstellungen</button>
      </div>
    </div>
  `;
}

renderIntro();
</script>
